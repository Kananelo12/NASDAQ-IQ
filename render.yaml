# Render Blueprint: Dashboard > New > Blueprint, then point it at this repo.
# Secrets marked `sync: false` are entered in the Render dashboard on first deploy.
services:
  - type: web
    name: nasdaq-intelligence-api
    runtime: node
    plan: starter # Always on, so in-process cron runs. See .github/workflows/scheduled-jobs.yml for the free-plan fallback.
    region: frankfurt # Same region as the Neon project (AWS eu-central-1).
    buildCommand: npm ci --include=dev && npm run build -w backend
    preDeployCommand: npm run db:migrate -w backend
    startCommand: npm run start:prod -w backend
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: ENABLE_INTERNAL_CRON
        value: "true"
      - key: JOBS_SECRET
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: APP_URL
        sync: false # The static site URL, e.g. https://nasdaq-intelligence-web.onrender.com
      - key: BETTER_AUTH_SECRET
        generateValue: true
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: ALLOWED_EMAILS
        sync: false # Comma-separated Google account emails allowed into the app
      - key: GEMINI_API_KEY
        sync: false

  - type: web
    name: nasdaq-intelligence-web
    runtime: static
    buildCommand: npm ci && npm run build -w frontend
    staticPublishPath: frontend/dist
    routes:
      # Serve the API under the site's own origin so the auth cookie is first-party.
      # Update the destination if Render assigns the API a different URL.
      - type: rewrite
        source: /api/*
        destination: https://nasdaq-intelligence-api.onrender.com/api/*
      # SPA fallback so deep links like /events/123 load index.html.
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: NODE_VERSION
        value: "22"
